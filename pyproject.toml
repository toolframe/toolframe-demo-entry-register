[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "toolframe-demo-entry-register"
version = "0.4.1"
description = "Ordinary business plugin example for Toolframe"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "byfb", email = "62798989+byfb@users.noreply.github.com" }]
requires-python = ">=3.14"
dependencies = ["toolframe-sdk<1,>=0.4.0"]

[project.urls]
Homepage = "https://github.com/toolframe/toolframe-demo-entry-register"
Repository = "https://github.com/toolframe/toolframe-demo-entry-register"
Documentation = "https://github.com/toolframe/toolframe-demo-entry-register#readme"
Issues = "https://github.com/toolframe/toolframe-demo-entry-register/issues"

[project.optional-dependencies]
ui = ["streamlit==1.61.0"]

[project.entry-points."toolframe.plugins"]
entry-register = "toolframe_demo_entry_register.plugin:plugin"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
    "toolframe-sql-sqlite>=0.4,<0.5",
]

[tool.uv.sources]
toolframe-sdk = { path = "../toolframe-sdk", editable = true }
toolframe-sql-sqlite = { path = "../toolframe-sql-sqlite", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/toolframe_demo_entry_register"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
