schema_version = 1

required_capabilities = [
    "service:entry-register.entries",
    "entry-register/dashboard.page/main",
    "entry-register/mcp.tool/list_entries",
    "entry-register/llms.document/usage",
]

[application]
# Replace this documented example UUID and name for your local application.
id = "00000000-0000-0000-0000-000000000001"
name = "Entry Register"
host = "127.0.0.1"
port = 9876

[plugins.sql-sqlite]
source = "pypi:toolframe-sql-sqlite==0.4.0"
enabled = true

[plugins.streamlit-dashboard]
source = "pypi:toolframe-streamlit-dashboard==0.5.0"
enabled = true

[plugins.fastmcp]
source = "pypi:toolframe-fastmcp==0.3.0"
enabled = true

[plugins.llms-txt]
source = "pypi:toolframe-llms-txt==0.3.0"
enabled = true

[plugins.entry-register]
source = "pypi:toolframe-demo-entry-register==0.4.0"
enabled = true

[bindings]
"toolframe.sql" = "sql-sqlite"

[plugins.auth]
source = "pypi:toolframe-auth==0.3.0"
enabled = true

[plugins.dashboard-auth]
source = "pypi:toolframe-dashboard-auth==0.2.0"
enabled = true

[access]
mode = "public"
failure_mode = "closed"

[mcp_access]
mode = "public"
